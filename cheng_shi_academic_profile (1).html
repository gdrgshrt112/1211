                saveToStorage() {
                    // 停用本機快取覆蓋，確保程式碼為唯一真理來源
                },

                showConfirm(message, callback) {
                    this.confirmModalText = message;
                    this.confirmModalCallback = callback;
                    this.confirmModalOpen = true;
                },

                handleAvatarUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    if (file.size > 2 * 1024 * 1024) {
                        alert('圖片檔案過大 (大於 2MB)，可能會影響網頁載入速度。建議選擇較小的圖片檔或使用圖片網址。');
                    }

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.profile.avatar = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                get filteredCategories() {
                    if (!this.searchQuery.trim()) {
                        return this.categories;
                    }
                    const q = this.searchQuery.toLowerCase().trim();
                    return this.categories.map(cat => {
                        const matchingItems = cat.items.filter(item => {
                            const str = JSON.stringify(item).toLowerCase();
                            return str.includes(q);
                        });
                        return { ...cat, items: matchingItems };
                    }).filter(cat => cat.items.length > 0);
                },

                getTabCount(tabId) {
                    if (tabId === 'overview') {
                        return this.categories.reduce((acc, cat) => acc + cat.items.length, 0);
                    }
                    return this.categories
                        .filter(cat => cat.tabId === tabId)
                        .reduce((acc, cat) => acc + cat.items.length, 0);
                },

                toggleCMS() {
                    if (this.isAdmin) {
                        this.isAdmin = false;
                    } else {
                        this.passwordInput = '';
                        this.passwordError = '';
                        this.passwordModalOpen = true;
                    }
                },

                verifyPassword() {
                    if (this.passwordInput === '0817') {
                        this.isAdmin = true;
                        this.passwordModalOpen = false;
                        this.passwordInput = '';
                        this.passwordError = '';
                    } else {
                        this.passwordError = '密碼錯誤，請重新輸入';
                    }
                },

                triggerPrint() {
                    window.print();
                },

                moveCategory(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex >= 0 && newIndex < this.categories.length) {
                        const temp = this.categories[index];
                        this.categories[index] = this.categories[newIndex];
                        this.categories[newIndex] = temp;
                        this.saveToStorage();
                    }
                },

                deleteCategory(index) {
                    this.showConfirm('確定要刪除這個子區塊及其所有條目嗎？', () => {
                        this.categories.splice(index, 1);
                        this.saveToStorage();
                    });
                },

                editCategoryModal(cat) {
                    const newTitle = prompt('請輸入子區塊標題：', cat.title);
                    if (newTitle !== null && newTitle.trim() !== '') {
                        cat.title = newTitle.trim();
                        this.saveToStorage();
                    }
                },

                addNewSubsectionModal() {
                    const title = prompt('請輸入新子區塊標題：', 'NEW SUBSECTION');
                    if (title) {
                        const tabId = prompt('請選擇所屬分頁代碼 (profile / publications / grants / service):', 'profile');
                        const type = prompt('請選擇內容格式 (general / grants / publications):', 'general');
                        this.categories.push({
                            id: 'sub-' + Date.now(),
                            tabId: tabId || 'profile',
                            title: title,
                            type: type || 'general',
                            visible: true,
                            items: []
                        });
                        this.saveToStorage();
                    }
                },

                editTabModal(tab) {
                    this.tabForm = { id: tab.id, name: tab.name, icon: tab.icon };
                    this.tabModalOpen = true;
                },

                saveTab() {
                    const tab = this.tabs.find(t => t.id === this.tabForm.id);
                    if (tab) {
                        tab.name = this.tabForm.name;
                        tab.icon = this.tabForm.icon;
                        this.saveToStorage();
                    }
                    this.tabModalOpen = false;
                },

                addNewCategoryModal() {
                    this.newTabForm = { id: 'tab-' + Date.now(), name: '新分頁 New Tab', icon: '🌟' };
                    this.newTabModalOpen = true;
                },

                saveNewTab() {
                    if (!this.newTabForm.name) return;
                    this.tabs.push({ ...this.newTabForm });
                    this.saveToStorage();
                    this.newTabModalOpen = false;
                },

                deleteTab(tabId) {
                    this.showConfirm('確定要刪除此分頁標籤嗎？', () => {
                        this.tabs = this.tabs.filter(t => t.id !== tabId);
                        this.activeTab = 'overview';
                        this.saveToStorage();
                    });
                },

                moveItem(cat, index, direction) {
                    const newIndex = index + direction;
                    if (newIndex >= 0 && newIndex < cat.items.length) {
                        const temp = cat.items[index];
                        cat.items[index] = cat.items[newIndex];
                        cat.items[newIndex] = temp;
                        this.saveToStorage();
                    }
                },

                deleteItem(cat, index) {
                    this.showConfirm('確定要刪除此條目嗎？', () => {
                        cat.items.splice(index, 1);
                        this.saveToStorage();
                    });
                },

                addNewItem(cat) {
                    this.isEditingItem = false;
                    this.currentItemCategory = cat;
                    this.currentItemCategoryType = cat.type;
                    this.itemForm = {
                        id: 'item-' + Date.now(),
                        visible: true,
                        grantScope: 'External',
                        role: 'PI',
                        date: new Date().getFullYear().toString(),
                        title: '',
                        agency: '',
                        amount: '',
                        overview: '',
                        authors: '',
                        year: new Date().getFullYear().toString(),
                        journal: '',
                        details: '',
                        doi: '',
                        badge: '',
                        subtitle: '',
                        advisor: '',
                        description: ''
                    };
                    this.itemModalOpen = true;
                },

                editItemModal(cat, item, index) {
                    this.isEditingItem = true;
                    this.currentItemCategory = cat;
                    this.currentItemCategoryType = cat.type;
                    this.editingItemIndex = index;
                    this.itemForm = JSON.parse(JSON.stringify(item));
                    this.itemModalOpen = true;
                },

                saveItem() {
                    if (this.isEditingItem) {
                        this.currentItemCategory.items[this.editingItemIndex] = { ...this.itemForm };
                    } else {
                        this.currentItemCategory.items.push({ ...this.itemForm });
                    }
                    this.saveToStorage();
                    this.itemModalOpen = false;
                },

                saveProfile() {
                    this.saveToStorage();
                    this.editProfileModal = false;
                },

                exportData() {
                    const payload = { profile: this.profile, tabs: this.tabs, categories: this.categories };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `cheng_shi_academic_cv_${Date.now()}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const parsed = JSON.parse(e.target.result);
                            if (parsed.categories && parsed.profile) {
                                this.categories = parsed.categories;
                                this.profile = parsed.profile;
                                if (parsed.tabs) this.tabs = parsed.tabs;
                                this.saveToStorage();
                                alert('成功匯入數據！');
                            }
                        } catch (err) {
                            alert('格式錯誤，請提供有效的 JSON 備份檔案。');
                        }
                    };
                    reader.readAsText(file);
                },

                resetDefaultData() {
                    this.showConfirm('警告：這將重置所有手動修改並恢復 2026 年最新全量 CV 履歷資料！確定繼續嗎？', () => {
                        localStorage.clear();
                        location.reload();
                    });
                }
            };
        }
    </script>
</body>
</html>
